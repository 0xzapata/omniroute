name: Build and Push to GHCR

on:
  push:
    branches:
      - zeabur
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "open-sse/**"
      - "docker-compose.yml"
      - "scripts/check-permissions.sh"
      - "scripts/dev/run-standalone.mjs"
      - "scripts/dev/healthcheck.mjs"
      - "scripts/build/**"
      - ".github/workflows/ghcr-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 0xzapata/omniroute

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target:
          - runner-base
          - runner-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from commit SHA
        id: version
        run: |
          VERSION="${GITHUB_SHA::8}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Docker image: $IMAGE_NAME:$VERSION-${{ matrix.target }}"

      - name: Extract package version from package.json
        id: pkg-version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $PKG_VERSION"

      - name: Extract metadata for labels/tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build Docker image for smoke check
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: omniroute-smoke:${{ matrix.target }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
          cache-from: type=gha

      - name: Smoke test Docker image
        run: |
          set -euo pipefail
          container_id="$(docker run -d \
            -e JWT_SECRET=ghcr-smoke-test-jwt-secret-at-least-32-characters \
            -e API_KEY_SECRET=0123456789abcdef0123456789abcdef \
            -e INITIAL_PASSWORD=ghcr-smoke-test-password \
            -e DATA_DIR=/tmp/omniroute-smoke \
            -p 20128:20128 \
            omniroute-smoke:${{ matrix.target }})"
          trap 'docker logs "$container_id" || true; docker rm -f "$container_id" || true' EXIT

          for attempt in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" != "true" ]; then
              exit 1
            fi

            if docker exec "$container_id" node healthcheck.mjs; then
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Build and push Docker image
        if: matrix.target != 'runner-cli'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.target }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.pkg-version.outputs.version }}-${{ matrix.target }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.target }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push runner-cli Docker image
        if: matrix.target == 'runner-cli'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.target }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.pkg-version.outputs.version }}-${{ matrix.target }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.target }}
            ghcr.io/0xzapata/omniroute:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.target }}"
